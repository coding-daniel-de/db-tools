# Ein Server für db-send und db-fetch. Kopieren nach remote_<name>.conf (der Name ist das,
# was man bei db-send/db-fetch als <server> angibt):
#   cp remote_template.conf remote_projekt-live.conf
#
# Verbindungsdaten (Host, User, Port, Key) stehen NICHT hier, sondern als Alias in ~/.ssh/config.
SSH_HOST="projekt-live"

# Ordner auf dem Server, relativ zum Home des SSH-Users oder absolut (Tilde nicht verwenden).
# Standard, wenn nicht gesetzt: sql-dumps und sql-patches.
REMOTE_DUMP_DIR="sql-dumps"
REMOTE_PATCH_DIR="sql-patches"
